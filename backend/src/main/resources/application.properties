# Server Port
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/shiptrack
spring.datasource.username=postgres
spring.datasource.password=aniket@12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# We use validate here because Flyway handles the table creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration (Secret should ideally be in env variables, hardcoded for simplicity in portfolio)
jwt.secret=ThisIsAVerySecretKeyForShipTrackProThatIsAtLeast32BytesLong!
jwt.expiration=86400000

# Disable default Spring Security generated password
spring.security.user.name=user
spring.security.user.password=dummy
